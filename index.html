<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title>OpenPresso Project</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script type="text/javascript" src="libopenpresso/redirect.js"></script>
    <script type="text/javascript">
        async function setHref() {
            logoLink.href=await getDefaultVersionPath('libopenpresso'); 
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <a href="/libopenpresso" id="logoLink">
                <img src="logo.svg" alt="OpenPresso Logo" class="logo-svg logo">
            </a>
        </div>
        <h1>Welcome to <span class="accent">OpenPresso</span></h1>
        <p class="subtitle">Coming soon</p>
    </div>
    <script type="text/javascript">setHref();</script>
</body>
</html>
